<style>
:root{--bg:#F7F3F0;--card:#FFFFFF;--ink:#1E1423;--mute:#675C6C;--line:#E0D6DE;--accent:#8B2B63;--onaccent:#FFFFFF;--soft:#F3E3EC;--warn:#9A5B00;--bad:#B3301F;--bar:#8B2B63}

:root[data-theme="dark"]{--bg:#150E19;--card:#1F1626;--ink:#F1E9F3;--mute:#AC9FB1;--line:#36283C;--accent:#F08CC0;--onaccent:#2A0D1D;--soft:#2F1D38;--warn:#F2B04B;--bad:#F08A7A;--bar:#F08CC0;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;line-height:1.12;margin:0;text-wrap:balance}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:980px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:10px;min-height:56px}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;flex:1}
.logo small{display:block;font:500 11px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:3px}
.ib{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
nav.tabs{display:flex;gap:6px;padding:0 0 10px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500}
.tab[aria-selected="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:600}
main{padding:20px 0 96px}
section[hidden]{display:none}
.hero h1{font-size:clamp(30px,6vw,46px)}
.hero p{color:var(--mute);max-width:60ch;margin:10px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font:700 26px 'Space Grotesk',sans-serif}
.stat span{font-size:13px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.list{display:grid;gap:12px}
.pv{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.pv h3{font-size:19px}
.meta{font-size:13.5px;color:var(--mute);margin-top:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.pill.g{background:var(--soft);color:var(--accent);border-color:transparent}
.pill.w{color:var(--warn)}
.price{font:700 20px 'Space Grotesk',sans-serif;text-align:right}
.price small{display:block;font:500 12px Inter,sans-serif;color:var(--mute)}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;display:inline-flex;align-items:center;cursor:pointer}
.btn.p{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
td.n,th.n{text-align:right;white-space:nowrap}
.tw{overflow-x:auto}
.bars{display:grid;gap:10px}
.br{display:grid;grid-template-columns:minmax(100px,170px) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.br i{display:block;height:14px;border-radius:7px;background:var(--bar)}
.br em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
.f{display:grid;gap:6px;margin:12px 0}
.f label{font-size:13px;color:var(--mute);font-weight:500}
.f select,.f input[type=number],.f input[type=search]{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;width:100%}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.res .stat b{font-size:30px;color:var(--accent)}
.note{font-size:12.5px;color:var(--mute);margin-top:10px}
.sub{font-size:13px;color:var(--mute)}
h2{font-size:24px;margin:26px 0 10px}
.two{display:grid;gap:16px}
@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}
.warnbox{border:1px solid var(--warn);border-radius:14px;padding:12px 14px;font-size:14px;margin:12px 0;background:var(--card)}
.key{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.key b{font-variant-numeric:tabular-nums;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal .h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:center;padding:4px 0}
.cd{min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;padding:4px 2px;text-align:center;font-size:14px}
.cd small{display:block;font-size:11px;color:var(--accent);font-weight:700;min-height:14px}
.cd.o{opacity:.35;cursor:default}
.cd.t{border-color:var(--accent);font-weight:700}
.cd[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.cd[aria-pressed="true"] small{color:var(--onaccent)}
.cn{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ck{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ck input{width:22px;height:22px;margin-top:2px;flex:none}
footer{font-size:12px;color:var(--mute);padding:20px 0}
@media (prefers-reduced-motion:no-preference){.pv{transition:transform .12s}.pv:hover{transform:translateY(-1px)}}
</style>
</head>

const addD=(s,n)=>{const d=toD(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const dow=s=>(toD(s).getUTCDay()+6)%7;
const DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],MF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const fd=s=>DN[dow(s)]+' '+(+s.slice(8))+' '+MN[+s.slice(5,7)-1];
function pn(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Prague',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());const g=k=>p.find(x=>x.type===k).value;return{iso:g('year')+'-'+g('month')+'-'+g('day'),min:(+g('hour')%24)*60+(+g('minute'))}}
E.forEach(e=>{let a=[];if(e.ds)a=e.ds.slice();else{let d=e.r[0];while(d<=e.r[1]){if(!e.wd||e.wd.includes(dow(d)))a.push(d);d=addD(d,1)}}e._d=a});
const hm=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const kc=n=>Math.round(n).toLocaleString('en-GB').replace(/,/g,' ')+' Kč';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const dist=(a,b)=>{const R=6371000,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]),h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const dtx=m=>m<1000?Math.max(10,Math.round(m/10)*10)+' m':(m/1000).toFixed(1)+' km';
const wk=m=>Math.max(1,Math.round(m*1.3/80))+' min walk';
const gm=v=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(v.v+', Praha');
const hasP=e=>e.lo!=null;
const nextD=(e,from)=>e._d.find(d=>d>=from)||null;
const inWin=(e,a,b)=>e._d.some(d=>d>=a&&d<=b);
// state
const S={tab:'find',w:'today',c:'all',free:false,q:'',lim:30,loc:null,calDay:null,calMon:null,plan:{a:2,k:0,sc:'lo',hire:true,pick:new Set(['sk-letna','ex-banksy'])}};
const TABS=[['find',"What's on"],['cal','Calendar'],['tix','Tickets'],['plan','Budget'],['about','Sources']];
$('tabs').innerHTML=TABS.map(t=>`<button class="tab" role="tab" data-t="${t[0]}" aria-selected="false">${t[1]}</button>`).join('');
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)go(b.dataset.t)});
function go(t){S.tab=t;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));TABS.forEach(x=>$('s-'+x[0]).hidden=x[0]!==t);try{history.replaceState(null,'','#'+t)}catch(e){}window.scrollTo(0,0)}
function win(){const T=pn().iso;if(S.w==='today')return[T,T];if(S.w==='wkend'){const d=dow(T);if(d>=5)return[T,addD(T,6-d)];return[addD(T,5-d),addD(T,6-d)]}if(S.w==='7d')return[T,addD(T,6)];return[T,'2099-12-31']}
function card(e,day){const T=pn().iso,nx=day||nextD(e,T);
 const d=S.loc&&e.ll?dist(S.loc,e.ll):null;
 const pr=hasP(e)?`<div class="price">${e.lo===e.hi?kc(e.lo):'from '+kc(e.lo)}<small>${e.lo===e.hi?'ticket':'to '+kc(e.hi)}</small></div>`:e.free?`<div class="price">Free</div>`:'';
 return `<article class="pv"><div style="display:flex;justify-content:space-between;gap:10px"><div style="min-width:0"><h3>${e.n}</h3><div class="meta">${e.w}</div><div class="meta">${e.v}${d!=null?' · '+dtx(d)+' away, '+wk(d):''}</div></div>${pr}</div>
 <div class="row"><span class="pill g">${CATS[e.c]}</span>${e.free?'<span class="pill g">Free entry</span>':''}${nx&&nx===pn().iso?'<span class="pill g">Today</span>':nx&&!e.og?`<span class="pill">Next: ${fd(nx)}</span>`:''}${!e.free&&!hasP(e)?'<span class="pill w">No price found</span>':''}</div>
 <p class="meta" style="margin:8px 0 0">${hasP(e)||e.free?e.pr+'.':e.pr+'.'}${e.note?' '+e.note:''}</p>
 <div class="row">${e.ll?`<a class="btn p" href="${gm(e)}" target="_blank" rel="noopener">Directions</a>`:''}<a class="btn" href="${e.src[0][1]}" target="_blank" rel="noopener">Source</a>${nx?`<button class="btn" data-ics="${e.id}" data-day="${nx}">Add ${fd(nx)} to calendar</button>`:''}</div></article>`}
function rFind(){const [a,b]=win(),T=pn().iso;
 const nq=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),qq=nq(S.q.trim());
 let L=E.filter(e=>(S.c==='all'||e.c===S.c)&&(!S.free||e.free)&&(!qq||nq(e.n+' '+e.v).includes(qq))&&inWin(e,a,b));
 const first=e=>e._d.find(d=>d>=a&&d<=b);
 const ded=L.filter(e=>!e.og).sort((x,y)=>first(x).localeCompare(first(y))||((x.t?x.t[0]:0)-(y.t?y.t[0]:0)));
 const og=L.filter(e=>e.og).sort((x,y)=>x.n.localeCompare(y.n));
 const todayN=E.filter(e=>e._d.includes(T)).length,freeN=E.filter(e=>e.free&&e._d.some(d=>d>=T)).length,pricedN=E.filter(e=>hasP(e)).length;
 const WL={today:'today',wkend:'this weekend','7d':'in the next 7 days',all:'from today onwards'};
 let body='';let lastD='';
 ded.slice(0,S.lim).forEach(e=>{const f=first(e);if(S.w!=='today'&&f!==lastD){body+=`<h2 style="font-size:19px;margin:14px 0 2px">${fd(f)}</h2>`;lastD=f}body+=card(e,f)});
 $('s-find').innerHTML=`<div class="hero"><h1>What's on in Prague?</h1><p>${E.length} events and seasonal attractions from mid-November 2026 into early 2027, with dates, venues and ticket prices where the sources publish them.</p></div>
 <div class="stats"><div class="stat"><b>${todayN}</b><span>listings today</span></div><div class="stat"><b>${freeN}</b><span>free to enter</span></div><div class="stat"><b>${pricedN}</b><span>with a published price</span></div><div class="stat"><b>28 Nov</b><span>main Christmas markets open</span></div></div>
 <div class="chips" role="group" aria-label="When">${[['today','Today'],['wkend','This weekend'],['7d','Next 7 days'],['all','All upcoming']].map(x=>`<button class="chip" data-w="${x[0]}" aria-pressed="${S.w===x[0]}">${x[1]}</button>`).join('')}</div>
 <div class="chips" role="group" aria-label="Category"><button class="chip" data-c="all" aria-pressed="${S.c==='all'}">All</button>${Object.keys(CATS).map(k=>`<button class="chip" data-c="${k}" aria-pressed="${S.c===k}">${CATS[k]}</button>`).join('')}<button class="chip" data-free="1" aria-pressed="${S.free}">Free only</button></div>
 <div class="f"><label for="q">Search by name or venue</label><input id="q" type="search" placeholder="For example Rudolfinum, jazz, Roxy" value="${esc(S.q)}"></div>
 <p class="sub">${L.length} ${L.length===1?'listing':'listings'} ${WL[S.w]}.${S.loc?'':' Tap "Near me" at the top to see distances.'}</p>
 <div class="list">${body||''}${ded.length>S.lim?`<button class="btn" data-more="1" style="justify-content:center">Show more (${ded.length-S.lim} left)</button>`:''}${!ded.length&&!og.length?'<div class="card">Nothing in the sources matches these filters. Try "All upcoming".</div>':''}</div>
 ${og.length?`<h2 style="font-size:20px">Open all season</h2><p class="sub">Long runs, markets and rinks that are open on most days in this period.</p><div class="list">${og.map(e=>card(e,null)).join('')}</div>`:''}
 <h2>Key dates</h2><div class="card"><div class="key">${KEY.map(k=>`<b>${k[0]}</b><span>${k[1]}</span>`).join('')}</div><p class="note">The Christmas tree lighting date and time were not in any source I could read, so I do not list it.</p></div>`}
$('s-find').addEventListener('click',e=>{const w=e.target.closest('[data-w]');if(w){S.w=w.dataset.w;S.lim=30;rFind();return}const c=e.target.closest('[data-c]');if(c){S.c=c.dataset.c;S.lim=30;rFind();return}if(e.target.closest('[data-free]')){S.free=!S.free;S.lim=30;rFind();return}if(e.target.closest('[data-more]')){S.lim+=40;rFind();return}icsClick(e)});
$('s-find').addEventListener('input',e=>{if(e.target.id!=='q')return;S.q=e.target.value;S.lim=30;const p=e.target.selectionStart;rFind();const q=$('q');q.focus();try{q.setSelectionRange(p,p)}catch(x){}});
// ICS
const ie=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function icsMake(ev,day){const d=day.replace(/-/g,'');const n=pn().iso.replace(/-/g,'');
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Prague Events Tab//EN','CALSCALE:GREGORIAN','BEGIN:VTIMEZONE','TZID:Europe/Prague','BEGIN:STANDARD','DTSTART:19701025T030000','TZOFFSETFROM:+0200','TZOFFSETTO:+0100','RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU','END:STANDARD','BEGIN:DAYLIGHT','DTSTART:19700329T020000','TZOFFSETFROM:+0100','TZOFFSETTO:+0200','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU','END:DAYLIGHT','END:VTIMEZONE','BEGIN:VEVENT','UID:'+ev.id+'-'+d+'@prague-events-tab','DTSTAMP:'+n+'T000000Z','SUMMARY:'+ie(ev.n),'LOCATION:'+ie(ev.v+', Praha'),'DESCRIPTION:'+ie(ev.w+'. '+ev.pr+'. Source: '+ev.src[0][1]+'. Confirm details with the organiser.')];
 if(ev.t){const s=ev.t[0],e=Math.min(ev.t[1]>ev.t[0]?ev.t[1]:s+120,1439);L.push('DTSTART;TZID=Europe/Prague:'+d+'T'+pad(Math.floor(s/60))+pad(s%60)+'00','DTEND;TZID=Europe/Prague:'+d+'T'+pad(Math.floor(e/60))+pad(e%60)+'00')}
 else L.push('DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+addD(day,1).replace(/-/g,''));
 L.push('BEGIN:VALARM','TRIGGER:-PT60M','ACTION:DISPLAY','DESCRIPTION:'+ie(ev.n),'END:VALARM','END:VEVENT','END:VCALENDAR');return L.join('\r\n')}
function icsClick(e){const b=e.target.closest('[data-ics]');if(!b)return;const ev=E.find(x=>x.id===b.dataset.ics);if(!ev)return;try{const bl=new Blob([icsMake(ev,b.dataset.day)],{type:'text/calendar;charset=utf-8'}),u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download=ev.id+'-'+b.dataset.day+'.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);b.textContent='Calendar file ready ✓'}catch(x){b.textContent='Could not create file'}}
// CALENDAR
function rCal(){const T=pn().iso;if(!S.calMon)S.calMon=T.slice(0,7);if(!S.calDay)S.calDay=T;
 const [y,m]=S.calMon.split('-').map(Number),first=`${y}-${pad(m)}-01`,off=dow(first),dim=new Date(Date.UTC(y,m,0)).getUTCDate();
 const prev=m===1?`${y-1}-12`:`${y}-${pad(m-1)}`,next=m===12?`${y+1}-01`:`${y}-${pad(m+1)}`;
 const minM=T.slice(0,7),maxM='2027-03';
 let cells='';for(let i=0;i<off;i++)cells+='<div></div>';
 for(let d=1;d<=dim;d++){const s=`${y}-${pad(m)}-${pad(d)}`,n=E.filter(e=>!e.og&&e._d.includes(s)).length,past=s<T;cells+=`<button class="cd${past?' o':''}${s===T?' t':''}" data-d="${s}" ${past?'disabled':''} aria-pressed="${S.calDay===s}" aria-label="${fd(s)}, ${n} dated events">${d}<small>${n||''}</small></button>`}
 const day=S.calDay,dated=E.filter(e=>!e.og&&e._d.includes(day)).sort((a,b)=>(a.t?a.t[0]:0)-(b.t?b.t[0]:0)),og=E.filter(e=>e.og&&e._d.includes(day));
 $('s-cal').innerHTML=`<h2 style="margin-top:0">Calendar</h2><p class="sub">Numbers show dated events on each day. Open-all-season markets and rinks are listed under the day you pick.</p>
 <div class="card"><div class="cn"><button class="btn" data-m="${prev}" ${S.calMon<=minM?'disabled':''}>‹ Prev</button><b style="font-family:'Space Grotesk',sans-serif;font-size:18px">${MF[m-1]} ${y}</b><button class="btn" data-m="${next}" ${S.calMon>=maxM?'disabled':''}>Next ›</button></div>
 <div class="cal">${DN.map(x=>`<div class="h">${x}</div>`).join('')}${cells}</div></div>
 <h2>${fd(day)}</h2><div class="list">${dated.map(e=>card(e,day)).join('')||'<div class="card">No dated events in the sources for this day.</div>'}</div>
 ${og.length?`<h2 style="font-size:20px">Also open this day</h2><div class="list">${og.map(e=>card(e,day)).join('')}</div>`:''}`}
$('s-cal').addEventListener('click',e=>{const d=e.target.closest('[data-d]');if(d&&!d.disabled){S.calDay=d.dataset.d;rCal();return}const m=e.target.closest('[data-m]');if(m&&!m.disabled){S.calMon=m.dataset.m;rCal();return}icsClick(e)});
// TICKETS
function rTix(){const P=E.filter(hasP).sort((a,b)=>a.lo-b.lo),mx=Math.max(...P.map(e=>e.lo)),fr=E.filter(e=>e.free),np=E.filter(e=>!hasP(e)&&!e.free);
 $('s-tix').innerHTML=`<h2 style="margin-top:0">What it costs</h2><p class="sub">Lowest published ticket for each event that lists a price, in Kč per person. Higher categories and child prices are in the table.</p>
 <div class="card"><div class="bars">${P.map(e=>`<div class="br"><span>${e.n}<span class="sub" style="display:block">${CATS[e.c]}</span></span><i style="width:${Math.max(3,e.lo/mx*100)}%"></i><em>${kc(e.lo)}</em></div>`).join('')}</div></div>
 <h2>Every published price</h2><div class="card tw"><table><thead><tr><th>Event</th><th>Published</th><th class="n">Lowest</th><th class="n">Highest</th></tr></thead><tbody>${P.map(e=>`<tr><td>${e.n}</td><td>${e.pr}</td><td class="n">${kc(e.lo)}</td><td class="n">${kc(e.hi)}</td></tr>`).join('')}</tbody></table></div>
 <h2>Free to enter</h2><div class="card"><ul style="margin:0;padding-left:20px">${fr.map(e=>`<li><b>${e.n}</b> <span class="sub">${e.w}</span></li>`).join('')}</ul></div>
 <div class="warnbox"><b>${np.length} listings have no price in their source.</b> I did not guess a number for them. Use the Source button on each card, or the organiser's ticket page.<details style="margin-top:8px"><summary style="cursor:pointer">Show which ones</summary><p class="sub" style="margin:8px 0 0">${np.map(e=>e.n).join(', ')}</p></details></div>
 <p class="note">Prices are copied from the sources on ${CHK}. Ticket resellers and booking fees can add to them.</p>`}
// PLAN
function rPlan(){const P=E.filter(hasP).sort((a,b)=>a.n.localeCompare(b.n)),{a,k,sc,hire,pick}=S.plan;
 const lines=[];let tot=0;
 P.filter(e=>pick.has(e.id)).forEach(e=>{const ad=sc==='lo'?e.lo:e.hi;let kid=e.ch!=null?e.ch:ad,flag=e.ch==null&&k>0;let h=0;if(hire&&e.hire)h=sc==='lo'?e.hire[0]:e.hire[1];const t=a*(ad+h)+k*(kid+h);tot+=t;lines.push({e,t,flag})});
 const pp=(a+k)>0?tot/(a+k):0;
 $('s-plan').innerHTML=`<h2 style="margin-top:0">Budget for a few days out</h2><p class="sub">Tick what you want to do. The planner uses published ticket prices only, so free events are not listed.</p>
 <div class="card"><div class="two"><div class="f"><label for="pa">Adults</label><input id="pa" type="number" inputmode="numeric" min="0" max="20" value="${a}"></div><div class="f"><label for="pk">Children</label><input id="pk" type="number" inputmode="numeric" min="0" max="20" value="${k}"></div></div>
 <div class="f"><label for="ps">Ticket category</label><select id="ps"><option value="lo"${sc==='lo'?' selected':''}>Cheapest published ticket</option><option value="hi"${sc==='hi'?' selected':''}>Most expensive published ticket</option></select></div>
 <label style="display:flex;gap:10px;align-items:center;min-height:44px"><input id="ph" type="checkbox"${hire?' checked':''} style="width:22px;height:22px"> Add skate hire for skating</label>
 <div class="res"><div class="stat"><span>Total</span><b id="pt">${kc(tot)}</b></div><div class="stat"><span>Per person</span><b id="pp" style="color:var(--ink)">${kc(pp)}</b></div></div>
 <div>${P.map(e=>`<label class="ck"><input type="checkbox" data-p="${e.id}"${pick.has(e.id)?' checked':''}><span><b>${e.n}</b><br><span class="sub">${e.pr}</span></span></label>`).join('')}</div>
 ${lines.length?`<div class="tw" style="margin-top:12px"><table><tbody>${lines.map(l=>`<tr><td>${l.e.n}${l.flag?'<div class="sub">Child price not published, counted at the adult price.</div>':''}${l.e.x?`<div class="sub">${l.e.x}</div>`:''}</td><td class="n">${kc(l.t)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="note">Nothing ticked yet.</p>'}
 <p class="note">A range event such as the O2 Arena has seat categories: the low and high options show the two ends. Check the organiser for the seat you want.</p></div>`;
 $('pa').oninput=e=>{const v=parseInt(e.target.value,10);if(v>=0&&v<=20){S.plan.a=v;rPlan();$('pa').focus()}};$('pk').oninput=e=>{const v=parseInt(e.target.value,10);if(v>=0&&v<=20){S.plan.k=v;rPlan();$('pk').focus()}};$('ps').onchange=e=>{S.plan.sc=e.target.value;rPlan()};$('ph').onchange=e=>{S.plan.hire=e.target.checked;rPlan()};
 document.querySelectorAll('[data-p]').forEach(c=>c.onchange=()=>{c.checked?S.plan.pick.add(c.dataset.p):S.plan.pick.delete(c.dataset.p);rPlan()})}
// ABOUT
function rAbout(){const SR=[...new Map(E.flatMap(e=>e.src).map(s=>[s[1],s])).values()];
 $('s-about').innerHTML=`<h2 style="margin-top:0">How this is built</h2><div class="card"><p style="margin-top:0"><b>Events, dates, venues and prices</b> are copied from the published pages listed below, as they stood on ${CHK}. Each card has a Source button.</p><p><b>No guessing.</b> If a source gave no price, the card says "No price found". If sources disagreed, the card says so (Republic Square market end date, the Advent concert venue, the Banksy end date).</p><p><b>Not included:</b> tree-lighting date and time (not in any source I could read), the Puccini season on 19 Nov (the source gave no venue), sport (I could not confirm fixtures), and the full club programme beyond late November, because the concert calendars only loaded their first pages. Small-venue gigs are listed for 15–23 Nov and for headline dates after that.</p><p><b>Distances</b> use approximate venue coordinates (small clubs have none) and a straight line, with walking time at about 80 m per minute plus 30% for streets. Some events have no coordinates because the source gave no place.</p><p style="margin-bottom:0"><b>Calendar files</b> add the event with a reminder one hour before. Times follow the source; when only a start time is given I assume two hours.</p></div>
 <h2>Sources</h2><div class="card"><ul style="margin:0;padding-left:20px">${SR.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a></li>`).join('')}</ul></div>
 <p class="note">Not affiliated with any organiser or venue. Always confirm times and tickets with the organiser.</p>`}
// controls
$('loc').onclick=()=>{if(!navigator.geolocation)return;$('loc').textContent='…';navigator.geolocation.getCurrentPosition(p=>{S.loc=[p.coords.latitude,p.coords.longitude];$('loc').textContent='Near me ✓';rFind();rCal()},()=>{$('loc').textContent='Near me'},{enableHighAccuracy:false,timeout:10000,maximumAge:300000})};
$('th').onclick=()=>{const r=document.documentElement,d=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'),n=d==='dark'?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('pet-theme',n)}catch(e){}};
try{const t=localStorage.getItem('pet-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}
rFind();rCal();rTix();rPlan();rAbout();
const h0=(location.hash||'').slice(1);go(TABS.map(t=>t[0]).includes(h0)?h0:'find');
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
